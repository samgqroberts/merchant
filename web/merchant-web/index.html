<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/merchant.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Merchant - Web Edition</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: #111;
                color: #eee;
                font-family: monospace;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                width: 100%;
            }
            @media (max-width: 800px) {
                body {
                    justify-content: flex-start;
                    padding-top: 20px;
                }
            }
            #game-container {
                width: 100%;
                display: flex;
                justify-content: center;
                overflow: auto;
            }
            #game-display {
                position: relative;
                font-family: monospace;
                white-space: pre;
                text-align: left;
                display: inline-block;
                width: auto;
            }
            .char {
                display: inline-block;
                width: 1ch;
                height: 1ch;
                line-height: 1ch;
                text-align: center;
                vertical-align: middle;
                text-decoration: inherit;
            }
            @keyframes blink {
                0% { opacity: 1; }
                50% { opacity: 0; }
                100% { opacity: 1; }
            }
            .underline {
                text-decoration: underline;
            }
            .bold {
                font-weight: bold;
            }
            .cursor-after {
                position: relative;
            }
            .cursor-after::after {
                content: '';
                display: inline-block;
                position: absolute;
                left: 0;
                bottom: 1px;
                width: 0.5em;
                height: 1em;
                background-color: #fff;
                animation: blink 1s infinite;
            }
            #footer {
                margin-top: 40px;
                font-size: 12px;
                color: #888;
            }
        </style>
    </head>
    <body>
        <!-- Hidden input field to trigger mobile keyboard -->
        <input
            id="mobile-keyboard-trigger"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            style="position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none;"
            aria-hidden="true"
        />
        <div id="game-container">
            <div id="game-display">Loading Merchant...</div>
        </div>
        <div id="footer">
            <p>By <a href="https://samgqroberts.com">samgqroberts</a></p>
        </div>
    </body>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
